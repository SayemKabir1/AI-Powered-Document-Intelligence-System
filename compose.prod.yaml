name: ai-document-intelligence-production
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 1.0

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    security_opt:
      - no-new-privileges:true
    mem_limit: 5g
    cpus: 4.0

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment: &app_environment
      APP_ENV: production
      DEMO_MODE: ${DEMO_MODE:-false}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      STORAGE_DIR: /var/lib/docintel/storage
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      SESSION_SECRET: ${SESSION_SECRET:-}
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      UPLOAD_REQUEST_MB: ${UPLOAD_REQUEST_MB:-100}
      UPLOAD_CONCURRENCY: ${UPLOAD_CONCURRENCY:-4}
      OLLAMA_ENABLED: ${OLLAMA_ENABLED:-true}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-12}
      WORKER_LEASE_TIMEOUT_SECONDS: ${WORKER_LEASE_TIMEOUT_SECONDS:-120}
      WORKER_HEARTBEAT_SECONDS: ${WORKER_HEARTBEAT_SECONDS:-30}
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    volumes:
      - app_storage:/var/lib/docintel/storage
    expose:
      - "8000"
    stop_grace_period: 180s
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid
    mem_limit: 2g
    cpus: 2.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment: *app_environment
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    volumes:
      - app_storage:/var/lib/docintel/storage
    stop_grace_period: 180s
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    read_only: true
    tmpfs:
      - /tmp:size=512m,noexec,nosuid
    mem_limit: 2g
    cpus: 2.0

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_DEMO_MODE: ${DEMO_MODE:-false}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    mem_limit: 256m
    cpus: 0.5

volumes:
  postgres_data:
  ollama_data:
  app_storage:
